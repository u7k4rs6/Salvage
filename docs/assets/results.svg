<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="Results">
<defs>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#E01F26"/>
    <stop offset="38%"  stop-color="#F2621A"/>
    <stop offset="72%"  stop-color="#FF8A1F"/>
    <stop offset="100%" stop-color="#FFB020"/>
  </linearGradient>
  <linearGradient id="fireV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FFB020"/>
    <stop offset="100%" stop-color="#E01F26"/>
  </linearGradient>
  <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#3A2A24"/>
    <stop offset="100%" stop-color="#4A382C"/>
  </linearGradient>
  <radialGradient id="bloom" cx="50%" cy="30%" r="70%">
    <stop offset="0%"   stop-color="#F2621A" stop-opacity="0.13"/>
    <stop offset="60%"  stop-color="#E01F26" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#12100E" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
<style>
    .bg    { fill: #050505; }
    .grid  { fill: url(#grid); opacity: .55; }
    .ttl   { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700;
             letter-spacing: 6px; fill: url(#fire); }
    .hd    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 3px; fill: #FF8A1F; }
    .note  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #7A6A5C; }
    .warm  { fill: #E8A99F; }
    .gold  { fill: #FFB020; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .panel { fill: #0C0A09; stroke: #241C17; stroke-width: 1; }
    .hair  { stroke: #1A1512; stroke-width: 1; }
    .dash  { stroke: #4A382C; stroke-width: 1.2; stroke-dasharray: 5 6; fill: none; }

    .grow { transform-origin: left center; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .fade { opacity: 0; animation: fade .45s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    .sp   { opacity: 0; animation: fade .5s ease-out forwards; }
    .scn  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #F5F0EA; }
    .sub  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11px; fill: #6B5C50; }
    .arm  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #7A6A5C; }
    .val  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #A99584; }
    .msg  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #7A6A5C; }
</style></defs>
<rect class="bg" width="1200" height="490"/>
<rect class="grid" width="1200" height="490"/>
<rect width="1200" height="490" fill="url(#bloom)"/>
<text class="hd" x="60" y="42">RECOVERED REVENUE AND MESSAGES SENT &#183; AT-RISK ORDER SET &#183; MEAN OF 10 SEEDS</text>
<text class="note" x="60" y="68">Identical worlds across every arm, proven by stream digest. The at-risk set is the same orders for all of them.</text>
<line class="hair" x1="60" y1="92" x2="1140" y2="92"/>
<text class="hd" x="60" y="112" fill="#5F5348">SCENARIO</text>
<text class="hd" x="252" y="112" fill="#5F5348">RECOVERED</text>
<text class="hd" x="1058" y="112" fill="#5F5348">MESSAGES</text>
<text class="scn" x="60" y="141">S1</text><text class="sub" x="60" y="158">issuer outage</text><text class="arm" x="154" y="140">agent</text><text class="arm" x="154" y="166">B2</text><rect class="grow" style="animation-delay:0.2s" x="252" y="127" width="323" height="18" rx="2" fill="url(#fire)"/><rect class="grow" style="animation-delay:0.30000000000000004s" x="252" y="153" width="256" height="18" rx="2" fill="url(#dim)"/><text class="val fade" style="animation-delay:1.0s" x="589" y="140" fill="#FFB020">2,21,154</text><text class="val fade" style="animation-delay:1.1s" x="522" y="166">1,75,050</text><text class="msg fade" style="animation-delay:1.0s" x="1058" y="140" fill="#FFB020">83</text><text class="msg fade" style="animation-delay:1.1s" x="1058" y="166">261</text>
<line class="hair" x1="60" y1="184" x2="1140" y2="184"/>
<text class="scn" x="60" y="211">S2</text><text class="sub" x="60" y="228">card BIN auth</text><text class="arm" x="154" y="210">agent</text><text class="arm" x="154" y="236">B2</text><rect class="grow" style="animation-delay:0.45s" x="252" y="197" width="176" height="18" rx="2" fill="url(#fire)"/><rect class="grow" style="animation-delay:0.55s" x="252" y="223" width="136" height="18" rx="2" fill="url(#dim)"/><text class="val fade" style="animation-delay:1.25s" x="442" y="210" fill="#FFB020">1,20,065</text><text class="val fade" style="animation-delay:1.35s" x="402" y="236">93,255</text><text class="msg fade" style="animation-delay:1.25s" x="1058" y="210" fill="#FFB020">44</text><text class="msg fade" style="animation-delay:1.35s" x="1058" y="236">140</text>
<line class="hair" x1="60" y1="254" x2="1140" y2="254"/>
<text class="scn" x="60" y="281">S3</text><text class="sub" x="60" y="298">gateway degradation</text><text class="arm" x="154" y="280">agent</text><text class="arm" x="154" y="306">B2</text><rect class="grow" style="animation-delay:0.7s" x="252" y="267" width="700" height="18" rx="2" fill="#8A5A22"/><rect class="grow" style="animation-delay:0.7999999999999999s" x="252" y="293" width="691" height="18" rx="2" fill="url(#dim)"/><text class="val fade" style="animation-delay:1.5s" x="966" y="280" >4,78,668</text><text class="val fade" style="animation-delay:1.6s" x="957" y="306">4,72,828</text><text class="msg fade" style="animation-delay:1.5s" x="1058" y="280" >422</text><text class="msg fade" style="animation-delay:1.6s" x="1058" y="306">492</text>
<line class="hair" x1="60" y1="324" x2="1140" y2="324"/>
<text class="scn" x="60" y="351">S4</text><text class="sub" x="60" y="368">merchant config</text><text class="arm" x="154" y="350">agent</text><text class="arm" x="154" y="376">B2</text><rect class="grow" style="animation-delay:0.95s" x="252" y="337" width="132" height="18" rx="2" fill="#7E1C16"/><rect class="grow" style="animation-delay:1.05s" x="252" y="363" width="241" height="18" rx="2" fill="url(#dim)"/><text class="val fade" style="animation-delay:1.75s" x="398" y="350" >90,128</text><text class="val fade" style="animation-delay:1.85s" x="507" y="376">1,65,041</text><text class="msg fade" style="animation-delay:1.75s" x="1058" y="350" >0</text><text class="msg fade" style="animation-delay:1.85s" x="1058" y="376">272</text>
<line class="hair" x1="60" y1="394" x2="1140" y2="394"/>
<text class="note warm" x="60" y="426">S4 is a loss and it is the most useful row here. No customer can pay their way around a merchant misconfiguration, so the agent contacts nobody and escalates.</text>
<text class="note" x="60" y="448" fill="#7A6A5C">S3 is a tie, not a win: 5,840 rupees on a paired standard deviation of 15,993, and the agent is behind on 1 of the 10 seeds.</text>
<text class="note" x="60" y="470" fill="#5F5348">Across the whole run rather than the at-risk set, the blunt baselines recover 29 to 44 percent more, by messaging roughly a thousand customers a day.</text>
</svg>
