<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Diagnosis">
<defs>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#E01F26"/>
    <stop offset="38%"  stop-color="#F2621A"/>
    <stop offset="72%"  stop-color="#FF8A1F"/>
    <stop offset="100%" stop-color="#FFB020"/>
  </linearGradient>
  <linearGradient id="fireV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FFB020"/>
    <stop offset="100%" stop-color="#E01F26"/>
  </linearGradient>
  <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#3A2A24"/>
    <stop offset="100%" stop-color="#4A382C"/>
  </linearGradient>
  <radialGradient id="bloom" cx="50%" cy="30%" r="70%">
    <stop offset="0%"   stop-color="#F2621A" stop-opacity="0.13"/>
    <stop offset="60%"  stop-color="#E01F26" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#12100E" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
<style>
    .bg    { fill: #050505; }
    .grid  { fill: url(#grid); opacity: .55; }
    .ttl   { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700;
             letter-spacing: 6px; fill: url(#fire); }
    .hd    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 3px; fill: #FF8A1F; }
    .note  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #7A6A5C; }
    .warm  { fill: #E8A99F; }
    .gold  { fill: #FFB020; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .panel { fill: #0C0A09; stroke: #241C17; stroke-width: 1; }
    .hair  { stroke: #1A1512; stroke-width: 1; }
    .dash  { stroke: #4A382C; stroke-width: 1.2; stroke-dasharray: 5 6; fill: none; }

    .in   { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { to { opacity: 1; } }
    .sp   { opacity: 0; animation: in .6s ease-out forwards; }
    .dr   { stroke-dasharray: 220; stroke-dashoffset: 220; animation: dr .7s ease-out 1.3s forwards; }
    @keyframes dr { to { stroke-dashoffset: 0; } }
    .fill { transform-origin: left center; transform: scaleX(0); animation: fl 1.1s cubic-bezier(.2,.7,.3,1) 2.0s forwards; }
    @keyframes fl { to { transform: scaleX(1); } }
    .lab  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 2.2px; fill: #6B5C50; }
    .cause{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14.5px; fill: #F5F0EA; }
    .det  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6B5C50; }
</style></defs>
<rect class="bg" width="1200" height="380"/>
<rect class="grid" width="1200" height="380"/>
<rect width="1200" height="380" fill="url(#bloom)"/>
<text class="hd" x="60" y="42">DIAGNOSIS &#183; TWO VERDICTS, CROSS CHECKED</text>
<text class="note" x="60" y="68">The evidence packet carries counts, rates and error distributions. No names, no contacts, no per-customer amounts.</text>

<g class="in" style="animation-delay:.25s">
  <rect class="panel" x="60" y="104" width="310" height="88" rx="4"/>
  <rect x="60" y="104" width="3" height="88" fill="url(#fireV)"/>
  <text class="lab"   x="82" y="129">RULES CLASSIFIER</text>
  <text class="cause" x="82" y="155">auth_failure_bin</text>
  <text class="det"   x="82" y="177">deterministic &#183; 37 of 41 incidents correct</text>
</g>
<g class="in" style="animation-delay:.65s">
  <rect class="panel" x="60" y="212" width="310" height="88" rx="4"/>
  <rect x="60" y="212" width="3" height="88" fill="url(#fireV)"/>
  <text class="lab"   x="82" y="237">LANGUAGE MODEL</text>
  <text class="cause" x="82" y="263">auth_failure_bin</text>
  <text class="det"   x="82" y="285">gemini-2.5-flash &#183; 40 of 41 correct</text>
</g>

<path class="dash dr" d="M370 148 H424 V200"/>
<path class="dash dr" d="M370 256 H424 V200"/>
<path class="dash dr" d="M424 200 H486"/>
<g class="sp" style="animation-delay:1.9s" transform="translate(424,200) scale(0.5)"><path d="M0,-9 C1.2,-2.4 2.4,-1.2 9,0 C2.4,1.2 1.2,2.4 0,9 C-1.2,2.4 -2.4,1.2 -9,0 C-2.4,-1.2 -1.2,-2.4 0,-9 Z" fill="url(#fireV)" filter="url(#glow)"/></g>
<g class="in" style="animation-delay:1.7s">
  <rect class="panel" x="486" y="150" width="330" height="106" rx="4" stroke="#5A3A1C"/>
  <rect x="486" y="150" width="3" height="106" fill="url(#fireV)"/>
  <text class="lab"   x="508" y="175">RECONCILED</text>
  <text class="cause" x="508" y="201" fill="url(#fire)">auth_failure_bin</text>
  <text class="det"   x="508" y="223">they agree, so confidence is raised</text>
  <text class="det"   x="508" y="241">disagreement would drop it below the gate</text>
</g>

<g class="in" style="animation-delay:2.1s">
  <text class="lab" x="866" y="175">CONFIDENCE AGAINST THE ACTION THRESHOLD</text>
  <rect x="866" y="187" width="254" height="11" rx="3" fill="#1A1512"/>
  <rect class="fill" x="866" y="187" width="241" height="11" rx="3" fill="url(#fire)" filter="url(#softglow)"/>
  <line x1="1018" y1="180" x2="1018" y2="205" stroke="#F5F0EA" stroke-width="1.5"/>
  <text class="det" x="1018" y="220" text-anchor="middle">0.60</text>
  <text class="mono gold" x="866" y="252" font-size="27" font-weight="700">0.95</text>
  <text class="det" x="930" y="252">above the threshold, the agent may act</text>
</g>

<text class="note" x="60" y="336" fill="#5F5348">Below 0.60 the agent cannot act at all. It escalates instead, which is why a confidently wrong cause costs nothing.</text>
<text class="note warm" x="60" y="358">Measured honestly: an arm whose model is replaced by a stub repeating the rules performs the same. On this workload the model did not detectably contribute to recovery.</text>
</svg>
