<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Salvage">
<defs>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#E01F26"/>
    <stop offset="38%"  stop-color="#F2621A"/>
    <stop offset="72%"  stop-color="#FF8A1F"/>
    <stop offset="100%" stop-color="#FFB020"/>
  </linearGradient>
  <linearGradient id="fireV" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#FFB020"/>
    <stop offset="100%" stop-color="#E01F26"/>
  </linearGradient>
  <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#3A2A24"/>
    <stop offset="100%" stop-color="#4A382C"/>
  </linearGradient>
  <radialGradient id="bloom" cx="50%" cy="30%" r="70%">
    <stop offset="0%"   stop-color="#F2621A" stop-opacity="0.13"/>
    <stop offset="60%"  stop-color="#E01F26" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#12100E" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="1.6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
<style>
    .bg    { fill: #050505; }
    .grid  { fill: url(#grid); opacity: .55; }
    .ttl   { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700;
             letter-spacing: 6px; fill: url(#fire); }
    .hd    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 10px; letter-spacing: 3px; fill: #FF8A1F; }
    .note  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #7A6A5C; }
    .warm  { fill: #E8A99F; }
    .gold  { fill: #FFB020; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .panel { fill: #0C0A09; stroke: #241C17; stroke-width: 1; }
    .hair  { stroke: #1A1512; stroke-width: 1; }
    .dash  { stroke: #4A382C; stroke-width: 1.2; stroke-dasharray: 5 6; fill: none; }

    .rise { opacity: 0; transform: translateY(10px); animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .sp   { opacity: 0; animation: spin 1s ease-out forwards; }
    @keyframes spin { to { opacity: 1; } }
    .ln   { stroke-dasharray: 400; stroke-dashoffset: 400; animation: ln 1.1s ease-out forwards; }
    @keyframes ln { to { stroke-dashoffset: 0; } }
    .tk   { opacity: 0; animation: tk .01s linear forwards; }
    @keyframes tk { to { opacity: 1; } }
    .fall { transform-origin: center bottom; animation: fall 1.1s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes fall { from { transform: scaleY(1); } to { transform: scaleY(.16); } }
    .brk  { opacity: 0; animation: spin .6s ease-out 3.4s forwards; }
    .drw  { stroke-dasharray: 380; stroke-dashoffset: 380; animation: ln .8s ease-out 3.4s forwards; }
    .pulse{ animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
</style></defs>
<rect class="bg" width="1200" height="420"/>
<rect class="grid" width="1200" height="420"/>
<rect width="1200" height="420" fill="url(#bloom)"/>

<!-- circuit rails -->
<g>
  <path class="dash ln" style="animation-delay:.1s" d="M60 92 H300"/>
  <circle cx="60" cy="92" r="4" fill="none" stroke="#E01F26" stroke-width="1.5" class="pulse"/>
  <path class="dash ln" style="animation-delay:.1s" d="M900 92 H1140"/>
  <circle cx="1140" cy="92" r="4" fill="none" stroke="#FFB020" stroke-width="1.5" class="pulse"/>
</g>

<g class="rise" style="animation-delay:.25s">
  <text class="ttl" x="600" y="106" font-size="52" text-anchor="middle" filter="url(#softglow)">SALVAGE</text>
</g>
<g class="rise" style="animation-delay:.45s">
  <text class="mono" x="600" y="136" font-size="11.5" letter-spacing="5" text-anchor="middle" fill="#8A7263">OBSERVE. RECOVER. PREVAIL.</text>
</g>
<g class="sp" style="animation-delay:1.0s" transform="translate(600,168) scale(0.9)"><path d="M0,-9 C1.2,-2.4 2.4,-1.2 9,0 C2.4,1.2 1.2,2.4 0,9 C-1.2,2.4 -2.4,1.2 -9,0 C-2.4,-1.2 -1.2,-2.4 0,-9 Z" fill="url(#fireV)" filter="url(#glow)"/></g>
<g class="rise" style="animation-delay:.6s">
  <text class="note" x="600" y="204" text-anchor="middle" fill="#8A7263">Payment failure recovery for Indian merchants on Razorpay.</text>
  <text class="note" x="600" y="226" text-anchor="middle" fill="#5F5348">It acts inside limits it cannot talk itself out of, and records every step.</text>
</g>

