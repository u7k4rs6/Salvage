<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvage console</title>
    <!-- Inline, because the deployed demo is a static host with no public/ directory and
         every browser asks for /favicon.ico whether or not one is declared. Without this
         the shipping build answered that request with a 404 on every page load. The mark
         is a rate dropping and coming back, in the console's own accent. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%230a0b0d%22%2F%3E%3Cpath%20d%3D%22M7%2011%20L13%2020%20L19%2014%20L25%209%22%20fill%3D%22none%22%20stroke%3D%22%234c8dd6%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E" />
    <!-- Two faces, split by who wrote the text. IBM Plex Sans for anything a person reads; IBM
         Plex Mono for anything a machine did: ids, hashes, timestamps, seeds, segment keys and
         amounts. No display face: an oversized headline is the fastest way for an operations
         console to start looking like a marketing page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
