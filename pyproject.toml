[project]
name = "salvage"
version = "0.1.0"
description = "AI revenue recovery agent for Razorpay merchants: detect payment degradation, diagnose it, recover bounded."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

# Dependency set is fixed by docs/02_TECHNICAL_ARCHITECTURE.md section 14.
# Anything added beyond that list is justified in docs/BUILD_LOG.md.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "pyyaml>=6.0",
  "numpy>=2.1",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.115",
  "ruff>=0.7",
]

[project.scripts]
salvage = "salvage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["salvage"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:salvage.*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.115",
  "ruff>=0.7",
]
